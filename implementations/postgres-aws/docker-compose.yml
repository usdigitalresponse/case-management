services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: case_management_postgres_aws
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/case_management_postgres_aws
      NODE_ENV: development
      PORT: 3000
      # Optional: set in a .env file next to this docker-compose.yml (never
      # committed — see .gitignore) to enable real SSO sign-in locally.
      # Without any of these, only /auth/dev-login is available (see
      # MAPPING.md).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-}
      MICROSOFT_ALLOWED_DOMAINS: ${MICROSOFT_ALLOWED_DOMAINS:-}
      # Comma-separated external emails — see .env.example.
      EXTERNAL_EMAIL_WHITELIST: ${EXTERNAL_EMAIL_WHITELIST:-}
      # The client (browser-facing) origin, not this server's own — see
      # .env.example.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Keep restarts non-destructive. Seed/reset demo data explicitly (see README).
    command: sh -c "npm install && npm run migrate && npm run dev"

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      # "localhost" inside this container means the container itself, not
      # the server container — see vite.config.ts.
      API_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      - server
    command: sh -c "npm install && npm run dev"

volumes:
  postgres-data:
  server-node-modules:
  client-node-modules:
