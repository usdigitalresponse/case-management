# Single-host production-mode stack for the hosted demo (see README
# "Deploy"). Run with an explicit env file, never the dev .env:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Its own project name keeps its containers and volumes separate from the
# dev stack in docker-compose.yml.
name: case-management-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *logging
    # If the host runs out of memory, the kernel kills other processes first.
    oom_score_adj: -500
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: case_management_postgres_aws
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    image: case-management-server
    restart: unless-stopped
    logging: *logging
    # Bounds the server and the reader processes it starts for uploaded PDFs
    # (a scan peaks around 500–700 MB, mostly outside Node's heap): past it
    # the kernel kills the biggest process here, the reader, whose import
    # then fails, never Postgres. Defaults fit the 1 GB demo instance with
    # its 2 GB swap file; raise both on a bigger host.
    mem_limit: ${SERVER_MEMORY_LIMIT:-700m}
    memswap_limit: ${SERVER_MEMORY_SWAP_LIMIT:-1700m}
    environment:
      # Kept below the container limit so Node fails cleanly before the
      # kernel steps in. The reader's own heap: INVOICE_EXTRACTION_MEMORY_MB.
      NODE_OPTIONS: --max-old-space-size=${SERVER_HEAP_MB:-256}
      INVOICE_EXTRACTION_MEMORY_MB: ${INVOICE_EXTRACTION_MEMORY_MB:-512}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/case_management_postgres_aws
      DOCUMENT_STORE_DIR: /var/lib/case-management/documents
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the env file}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      EXTERNAL_EMAIL_WHITELIST: ${EXTERNAL_EMAIL_WHITELIST:-}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      EXTERNAL_DEMO_LOGIN_ENABLED: ${EXTERNAL_DEMO_LOGIN_ENABLED:-false}
      # "aws" turns on driving-distance lookups for the mileage rule.
      ROUTE_CHECK_PROVIDER: ${ROUTE_CHECK_PROVIDER:-}
      ROUTE_CHECK_MONTHLY_CALL_WARNING: ${ROUTE_CHECK_MONTHLY_CALL_WARNING:-1000}
      ROUTE_CHECK_MONTHLY_CALL_LIMIT: ${ROUTE_CHECK_MONTHLY_CALL_LIMIT:-}
      ROUTE_CHECK_COUNTRY: ${ROUTE_CHECK_COUNTRY:-USA}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    # Uploaded invoice files, kept across redeploys (never backed up).
    volumes:
      - documents:/var/lib/case-management/documents
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./client
    image: case-management-web
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      # Persists Caddy's certificates across restarts, avoiding Let's
      # Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  documents:
