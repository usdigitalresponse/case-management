spec_version: "0.16.0"
status: draft
kind: workflows

workflows:
  case_lifecycle:
    entity: case
    history_entity: case_lifecycle_event
    transitions:
      - action: open
        from: absent
        to: configured_open_status
        requires: [authorized_actor, effective_timestamp, initial_participant_for_intake_or_source_request]
      - action: close
        from: configured_open_status
        to: configured_closed_status
        requires: [authorized_actor, effective_timestamp, reason, atomic_ending_of_all_active_assignments]
      - action: reopen
        from: configured_closed_status
        to: configured_open_status
        requires: [authorized_actor, effective_timestamp, reason]
    requirements:
      - State names above are semantic categories, not seeded reference IDs.
      - Additional within-state transitions and corrections follow preserve_case_lifecycle.
      - Closing atomically ends all active assignment roles at the closure effective timestamp with closing actor and reason.
      - Reopening leaves ended assignments inactive; reassignment creates new history records.
      - Closing does not cancel financial requests; any cancellation policy remains unresolved.
  payment_request:
    entity: invoice
    history_entity: invoice_event
    transitions:
      - action: submit
        from: draft
        to: submitted
        requires: [authorized_submitter, validated_lines, frozen_review_attempt, configured_attestation]
      - action: send_for_matching
        from: draft
        to: awaiting_match
        requires: [authorized_submitter, configured_attestation]
      - action: release_to_review
        from: awaiting_match
        to: submitted
        requires: [active_staff_user, case_and_provider_and_timekeepers_matched, validated_lines, frozen_review_attempt]
      - action: enter_in_review
        from: draft
        to: under_review
        requires: [active_staff_uploader, own_new_upload, sender_chosen, uploader_assigned_as_reviewer]
      - action: review
        from: [submitted, under_review]
        to: under_review
        requires: [active_staff_user, earlier_steps_complete, working_line_decision]
      - action: ask_question
        from: [submitted, under_review, awaiting_answer]
        to: awaiting_answer
        requires: [active_staff_user, line_of_request, brief_question]
      - action: answer_question
        from: awaiting_answer
        to: under_review
        requires: [submitter_or_represented_professional_or_recording_staff, brief_answer, no_other_unanswered_question]
      - action: finish_review
        from: under_review
        to: awaiting_sign_off
        requires: [active_staff_user, every_line_decided, reasons_for_partial_and_rejected_lines, immutable_round_of_decisions, two_people_taking_part, frozen_review_attempt_if_entered_in_review]
      - action: reopen_review
        from: awaiting_sign_off
        to: under_review
        requires: [active_staff_user, no_sign_off_decision_since_round]
      - action: send_back
        from: awaiting_sign_off
        to: under_review
        requires: [current_assigned_approver, internal_comment, immutable_decision]
      - action: approve
        from: awaiting_sign_off
        to: approved
        requires: [current_assigned_approver, every_assigned_approver_signed_off, two_people_taking_part, approved_line_amounts, atomic_authorization_draw_check]
      - action: reject_at_sign_off
        from: awaiting_sign_off
        to: rejected
        requires: [current_assigned_approver, two_people_taking_part, immutable_decision]
      - action: deny
        from: [submitted, under_review]
        to: denied
        requires: [current_assigned_reviewer, rejection_decision, reason]
      - action: request_changes
        from: [submitted, under_review]
        to: changes_requested
        requires: [current_assigned_reviewer, change_request_decision, reason]
      - action: revise
        from: [changes_requested, denied, approved]
        to: draft
        requires: [authorized_submitter, no_external_completion_confirmation, supersede_attempt, preserve_snapshot_and_decisions]
      - action: recall
        from: submitted
        to: draft
        requires: [authorized_submitter, no_review_decision_recorded, supersede_attempt, preserve_snapshot]
      - action: recall
        from: awaiting_match
        to: draft
        requires: [authorized_submitter]
      - action: return_to_submitter
        from: awaiting_match
        to: draft
        requires: [active_staff_user, reason_for_submitter]
      - action: withdraw
        from: draft
        to: withdrawn
        requires: [authorized_submitter, effective_timestamp]
      - action: delete
        from: [draft, withdrawn]
        to: absent
        requires: [authorized_submitter, no_review_decision]
      - action: discard_entry
        from: [under_review, awaiting_answer]
        to: absent
        requires: [assigned_reviewer, entry_open, no_question_asked]
    requirements:
      - Configure reference status mappings and actor permissions before enabling transitions.
      - Reviewed timestamps and reviewers come from decisions; final approval cannot be asserted by editing status.
      - Line decisions during review are working decisions (decide_invoice_lines); finish_review records them as one immutable round. A request with several sign-off approvers stays awaiting sign-off until the last approves, or any of them rejects it.
      - Any active staff member may decide lines, ask questions, finish or reopen a review, including one assigned to someone else; each decision records who made it. At least two different staff members take part in each round before it is approved or rejected (enforce_invoice_approval_sequence).
      - The reviewer may ask the submitter a question about a line (ask_review_question). Asking moves the request to awaiting_answer, where lines may still be decided but the round can't be finished; it returns to under_review when the last open question is answered. To stop waiting without a reply, staff record what they learned as the answer.
      - send_back returns the request to its line reviewer with an internal comment; deny and request_changes are the paths back to the submitter.
      - External completion confirmation references the approved attempt and leaves approval status unchanged; it never executes payment.
      - The submitter may edit a draft until submitting it, and may recall a submission before any review decision is recorded; recalled attempts keep their snapshot and the request returns to draft for editing. Starting over withdraws the draft; a new upload creates a new import and request.
      - Until any review decision is recorded, the submitter may delete a draft or withdrawn request outright, with its lines, events, earlier attempts recalled before review, any import record and file, and time entries its import created that no other request uses. Once a decision is recorded, the request is retained and only ever withdrawn.
      - An authorized submitter may be a configured delegate acting for professionals in their office (authorize_delegated_submission); represented professionals do not attest or approve.
      - Recall is not permitted once a review decision exists. Correction after external completion needs a product decision before implementation.
      - An invoice_import creates a draft through validate_invoice_import; time entries and expenses from its lines are created when that draft is submitted.
      - A reviewing staff member's own upload enters review at once, assigned to them (enter_request_in_review). Until its first round is finished, its reviewer enters and corrects lines and decides them in the same pass; finishing that round first freezes the request as an ordinary submission would, then records the round. Its lines never change after that, including after reopening or a send-back.
      - A request filed by person answers which case it is for, or that it is not for one case, before staff send it or finish its first round; an external submitter may leave it unanswered (match_invoice_to_case). Staff choose or add the case when sending or in review, never through a separate intake step.
      - send_for_matching is retired: nothing new is sent for matching. A request already awaiting match is still released to review once staff have matched it, with the attestation given on sending.
  preauthorization_request:
    entity: preauthorization_request
    history_entity: preauthorization_question
    transitions:
      - action: submit
        from: absent
        to: submitted
        requires: [authorized_requester_or_recording_staff, request_number, service_rate_amount_and_justification, received_at]
      - action: ask_for_information
        from: [submitted, info_requested]
        to: info_requested
        requires: [active_staff_user, brief_question]
      - action: answer
        from: info_requested
        to: submitted
        requires: [requester_or_recording_staff, brief_answer, no_other_unanswered_question]
      - action: approve
        from: submitted
        to: approved
        requires: [active_staff_user, provider_matched, case_chosen_or_not_for_one_case, approved_amount, preauthorization_decision_recorded_atomically_for_a_case]
      - action: deny
        from: [submitted, info_requested]
        to: denied
        requires: [active_staff_user, reason]
      - action: mark_not_needed
        from: [submitted, info_requested]
        to: not_needed
        requires: [active_staff_user, outcome_not_needed_duplicate_or_moot, reason]
      - action: withdraw
        from: [submitted, info_requested]
        to: withdrawn
        requires: [requester_or_recording_staff, effective_timestamp]
    requirements:
      - State names are semantic categories, not seeded reference IDs.
      - Decided and withdrawn requests are final and kept; asking again is a new request (request_preauthorization).
      - Approving a request for a case records the ceiling decision on the provider's preauthorization for the case in the same transaction (preserve_authorization_decisions); approving one not for one case records the decision and amount on the request only.
      - The decision timestamps and actors come from the request's recorded outcome; questions and answers are its history.
  requester_communication:
    entity: invoice
    history_entity: invoice_event
    transitions:
      - action: mark_communication_completed
        from: communication_pending
        to: communication_completed
        requires: [approved_or_rejected_request, active_staff_user, effective_timestamp]
    requirements:
      - Communication completed records that staff have finished telling the person who requested billing about the decision. It is a label separate from invoice approval status, which stays approved or rejected, and from external payment completion.
      - It is recorded once as an invoice event and never changed, and applies only while the request is approved or rejected. A later approval or rejection of the same request returns it to communication_pending.
      - It is staff-only; submitters and exports do not show it.
      - Undoing it needs a product decision before implementation.
  external_payment_completion:
    entity: invoice
    history_entity: payment
    transitions:
      - action: record_external_completion
        from: completion_unconfirmed
        to: completion_confirmed
        requires: [approved_request, authorized_recording_user, external_completion_evidence]
    requirements:
      - Completion states are read-model labels separate from invoice approval status.
      - Record the source, actor, timestamp and approved attempt; optional reported date and amount remain unknown when absent.
      - This transition records a fact about payment elsewhere and does not move money.
      - Partial settlement, mistaken confirmation and external reversal reconciliation require explicit policy before implementation.
  invoice_import:
    entity: invoice_import
    history_entity: audit_event
    transitions:
      - action: upload
        from: absent
        to: received
        requires: [authorized_submitter, immutable_document_version]
      - action: extract
        from: received
        to: [extracted, failed]
        requires: [approved_processing_boundary, recorded_extraction_method]
      - action: confirm
        from: extracted
        to: confirmed
        requires: [draft_request_created, resolving_actor, effective_timestamp]
      - action: discard
        from: [received, extracted, failed]
        to: discarded
        requires: [authorized_submitter, resolving_actor, effective_timestamp, document_content_deleted]
      - action: expire
        from: failed
        to: discarded
        requires: [three_days_since_upload, effective_timestamp, document_content_deleted]
    requirements:
      - State names are semantic categories, not seeded reference IDs.
      - Extraction failure keeps the document until the submitter discards it or it expires; the submitter may instead enter a request manually.
      - Expiry is a system action with no resolving user; after it the submitter must upload again.
      - Confirmed and discarded imports are final. Confirmation accepts the extracted values into the draft; the draft stays editable until submitted.
      - A read file's draft never expires. The file stays with its request, for the submitter and authorized reviewers, until the request is withdrawn or deleted (rules.yaml validate_invoice_import); a confirmed import keeps its file.
      - Re-processing requires a new upload and creates a new import.
