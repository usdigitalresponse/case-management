spec_version: "0.13.0"
status: draft
kind: business_rules

rules:
  flag_possible_duplicate_client:
    description: Identify possible existing people before creating a person or professional profile; the retained key applies to person identity generally, not only a client role.
    applies_to: person
    trigger: before_create
    outcome: warning
    requirements:
      - Show possible matches to the user.
      - Do not merge records automatically.
      - List people who may be recorded twice for staff - matched by email, by name ignoring word order, case, punctuation and initials, or by date of birth and family name - and pairs any staff member flagged. Never show the list to external submitters.
      - Any active staff user may flag two people as possibly one, or record that a listed pair are different people, with an optional note; record the actor and time. A pair found to be different people is no longer listed until flagged again.
      - Show everyone linked by any listed pair together, as one person who may have several records.

  flag_possible_duplicate_case:
    description: Identify open cases that may be one case recorded twice, for staff to clean up; cases are never merged here.
    applies_to: case
    trigger: on_read
    outcome: warning
    requirements:
      - List open cases for staff whose case numbers or identifiers match ignoring case, punctuation and leading zeros, and pairs any staff member flagged, grouping everything linked by any pair. Never show the list to external submitters.
      - A case number is only unique within its county, so never list or flag two cases whose counties are both set and differ. A missing county doesn't rule a pair out; a matching one is shown as supporting the match.
      - Any active staff user may flag two open cases in the same county (or without one) as possibly one, or record that a listed pair are different, with an optional note; record the actor and time.
      - Cases belong to the external case management system, so never merge them here. Staff clean up by closing the extra case (preserve_case_lifecycle) once its invoices are finished, which takes it off the list, or an administrator moves its requests to the case kept (correct_case_records).

  merge_duplicate_people:
    description: Merge a person recorded twice into the record kept, on an administrator's confirmation.
    applies_to: person
    trigger: before_change
    outcome: blocking
    requirements:
      - Only an administrator merges, one or more records into the one kept, all or none. Before merging, show any staff user exactly what would move to the kept person from each record, which of the kept record's empty details would be filled in, what is not moved, and anything that prevents the merge; the administrator confirms the two are the same person.
      - Move every reference to the retired person, and to their provider profile, to the kept person and their profile. Never replace a detail the kept record has. Their own rates, fee schedule and invoice reviewer move only when the kept profile has none. If the retired person's external sign-in is on and the kept person's is off, turn it on, since their account moves with them (manage_external_sign_in).
      - Refuse the merge while both profiles sign in with different accounts, both hold the same open role on a case, both are assigned to the same case, or both have a pre-authorization on the same case.
      - Keep the retired person, hidden from lists and searches, marked as merged into the kept person. Sent invoices keep their submission snapshots, and recorded actors stay as recorded.
      - Record every value the merge changed with its prior value, the administrator and the time. An administrator may undo a merge, or every merge made at once, restoring each value still as the merge left it and leaving anything changed since; an undo is refused while the kept person has since been merged into someone else.

  require_qualification_for_assignment:
    description: Evaluate professional qualifications before assigning a case.
    applies_to: case_assignment
    trigger: before_create
    outcome: configurable
    requirements:
      - Compare the case category with active professional qualifications.
      - Record any permitted override with its actor, reason, and timestamp.

  review_workload_before_assignment:
    description: Show current workload before assigning another case.
    applies_to: case_assignment
    trigger: before_create
    outcome: configurable
    requirements:
      - Calculate workload from active assignments and configurable policy data.
      - Record any permitted override with its actor, reason, and timestamp.

  validate_invoice_total:
    description: Compare the submitted invoice total with its calculated lines.
    applies_to: invoice
    trigger: before_submit
    outcome: blocking
    requirements:
      - Calculate the total from eligible invoice lines.
      - Explain any discrepancy to the user.

  flag_overlapping_invoice_period:
    description: Identify possible duplicate billing for the same professional, on the same case or another.
    applies_to: invoice
    trigger: before_submit
    outcome: warning
    requirements:
      - Compare the request's dates (its billing period and line dates together) with the professional's other sent requests, including those sent later. Withdrawn and rejected requests, and drafts never sent, are not compared; a request sent back to its sender still is. Lines a finished round rejected are left out.
      - On the same case, flag a request whose dates overlap, and list its lines inside the overlap. A request without a matched case is on the same case when its case number closely matches.
      - On another case, flag a request that bills the same person's time on a date this request bills them, and list those lines.
      - Name each listed line that has the same date, person, kind and quantity as a line on this request.
      - Show the flags to the submitter while the request is a draft, limited to requests they may read, and to reviewers throughout review. Never refuse the request for them.

  configure_invoice_approval_chain:
    description: Establish the required review for an invoice.
    applies_to: invoice_approval_chain
    trigger: before_create
    outcome: blocking
    requirements:
      - Allow only one non-superseded chain per invoice.

  enforce_invoice_approval_sequence:
    description: Record decisions only at the current stage of the chain, in order, by the user assigned to it.
    applies_to: invoice_approval_decision
    trigger: before_create
    outcome: blocking
    requirements:
      - Reject decisions for superseded chains.
      - Require a positive sequence_number, unique within the chain for invoice-level decisions and per line for line decisions.
      - Include invoice pre-approval decisions before line-review decisions when required by configured policy.
      - Require the deciding user to be an active staff user. Sign-off decisions are by the assigned approver whose turn it is, who must be allowed to sign off under the review settings (anyone on staff, or only the named sign-off approvers); a user other than the invoice submitter for pre-approval and sign-off.
      - At least two different staff members take part in each round - by deciding its lines, finishing it or signing it off - before it is approved or rejected. Finishing is refused when the people deciding, finishing and assigned to sign off are one person.
      - For invoice pre-approval and sign-off, omit invoice_line_id and allow one decision per sequence_number.
      - For line review, require invoice_line_id and allow one decision per line per sequence_number. A round of line review is recorded at one sequence_number, for every line at once, when it is finished (decide_invoice_lines).
      - Require the reviewed line to belong to the invoice referenced by the chain.
      - A line-review round is complete when every line has a decision; a rejected line counts as decided with nothing approved and does not block the request.
      - Sign-off decisions follow the latest complete line-review round, one per assigned approver in position order.
      - A sign-off send-back (changes requested) requires an internal_only comment and opens a new line-review round in the same chain; it does not return the request to the submitter.
      - A sign-off approver may instead reject the whole request, with an optional comment. The request is rejected and nothing on it is approved. Approving also takes an optional comment. Both are shared like line decision notes, not internal_only.
      - Denial or a request for changes from the submitter requires a reason and blocks advancement.
      - Record the actual deciding user and decision timestamp.
      - Apply record_approved_request_amounts to every decision and final allocation draw.

  decide_invoice_lines:
    description: Let staff decide each line, change their minds freely, and record the round only when it is finished.
    applies_to: invoice_line_working_decision
    trigger: before_change
    outcome: blocking
    requirements:
      - Any active staff user may record, change or undo working decisions, and only while the request is under review. Deciding a line on an unassigned request assigns line review to them; on a request someone else reviews, the assignment stays and the decision records who made it. Staff see when the request they are deciding is assigned to someone else.
      - Each line has at most one working decision; changing or undoing it replaces or removes it without history.
      - Approve takes the requested amount and needs no reason. Approve in part needs a reason code and an approved amount above zero and below the requested amount; on a line with hours the reviewer corrects the hours or the rate and the amount is their product rounded to cents, otherwise the reviewer corrects the amount. A reviewer may approve a line that states no hours.
      - Any reviewer may instead approve a line with hours or miles (time, travel time, waiting time or mileage) at a changed rate, higher or lower than billed, with no reason code; the amount is its quantity times that rate, rounded to cents, and may exceed the requested amount. A changed rate is flagged to the sign-off approvers before they sign off, with the billed rate and the line's configured_rate.
      - Reject needs a reason code and approves nothing. Any decision may carry a note; the reason code for another reason requires one.
      - Approving in part and rejecting each draw from their own list of reason codes (invoice_decision_reasons.applies_to); a reason may be on both. Setting a case rate has a third list; the reason for another reason is on every list. A reason not on the list for the outcome is refused. Administrators maintain the lists without a code release; a retired reason stays on decisions that used it.
      - Review flags a request that takes its professional, or the case, over the pre-authorized amount: what is approved on the case so far plus the request's total, above the latest ceiling. Reviewers may still approve or reject it.
      - Re-pricing applies approve-in-part decisions at the line's rate limit (apply_professional_rates), with the rate reason, to every undecided time line whose billed_rate is above it. A changed rate may also go to the matching lines or the case's default (set_case_rate).
      - Any active staff user may finish a round. It requires a working decision on every line; it records them all as invoice_approval_decision rows at a new sequence_number, each with the staff member who made that decision and when, clears the working decisions, records an invoice event with who finished it and moves the request to awaiting sign-off.
      - Until the first sign-off decision after a round, any staff user may reopen review; the next round starts from that round's decisions as working decisions and is recorded as a new round when finished. Recorded rounds are never changed.

  check_lines_against_time_log:
    description: Let the line reviewer compare a request's time lines with one case's time log exported from another system, flag every line it doesn't support, and optionally require a staff-only reason before approving those lines' billed hours.
    applies_to: review_time_log
    trigger: before_change
    outcome: blocking
    requirements:
      - Any active staff user may upload, replace or remove the log, choose its columns, say who a name is, or link entries, and only while the request is submitted, under review or awaiting an answer. Uploading does not take the request.
      - A log is CSV or a spreadsheet with a header row, which may sit below title rows. Its columns are found by their headers, preferring the date of the work and the worker over other dates and names; time spent may be in hours (decimal, h:mm or words) or minutes. The reviewer sees which columns were used and may choose others at any time without uploading again; a log whose date, worker and time spent can't be found is not kept until they are chosen.
      - The log covers one case. Only entries in the request's billing period, or between its lines' first and last dates when it has none, are compared; the rest are listed as outside it. Entries without a readable date or time are counted, not compared.
      - A name in the log is used for a person on the request only if it matches their name exactly, or once the reviewer confirms it. A likely variant, such as last name first or a first initial, is suggested, never assumed. The reviewer may mark a name as not a person, such as an office or shared account.
      - Each time line with a date and hours matches an entry with the same date, person and hours, pairing equal entries and lines in order. Every other time line is flagged, with the nearest explanation - more than one entry could match, the day's entries add up to it, the hours differ, the same hours fall a day apart, the day's time is only under another name, or nothing - and the entries it is about. Lines that aren't time are not checked.
      - The reviewer may link entries to a line, moving them from any other line. A linked line is flagged while its entries' hours differ from the line's. Changing a line's values keeps its links and compares it again.
      - Entries used by no line are listed as not billed, and days whose billed and logged hours differ for a person are listed.
      - A deployment setting decides whether approving a flagged line's billed hours needs a reason. When it does, any approval that keeps the billed hours - as billed, at a changed rate, cut by rate alone, or by repricing every line - is refused unless the reviewer says why (time_log_override); repricing leaves those lines undecided. Cutting the hours and rejecting need no such reason. Finishing the round is refused while such an approval without a reason stands on a line the log flags, such as one approved before the log was uploaded.
      - The reason is recorded with the line's decision when the round is finished, shown to staff and sign-off approvers, and never to the submitter, exports or the billing record.
      - The log is a working aid, not history. It is removed when the round is finished, when the request is recalled or deleted, or by the reviewer; a reopened review starts without one. Nothing from it reaches the submitter, exports or the billing record.

  enter_request_in_review:
    description: Let a reviewing staff member enter an invoice they received and decide its lines in one pass, freezing the request when they finish the first round.
    applies_to: invoice
    trigger: before_change
    outcome: blocking
    requirements:
      - An active staff user who uploads or types in a request, filed under the person it is from, takes it straight from draft to under review. They hold its line-review invoice_review_assignment and the default sign-off approvers are assigned, as on submission. It may be reassigned like any request in review.
      - Until the first round is finished the entry is open. Any active staff user may add, change or remove lines and set the case number as written on the request, its billing period, the number on the supplier's own invoice, and who it is from. Who it is from may be unknown when the entry starts; its lines show as read until it is chosen. Choosing or changing it prices the lines at that person's rates, moves lines attributed to the earlier choice to them, and removes the working decision on any line whose values change. A save, or a line decision, made from lines that changed since they were loaded (another window, or before a reassignment) is refused, and the latest lines are shown; nothing is overwritten or decided against unseen values. A deactivated account can no longer enter, as it can no longer decide. A reviewer's case number correction waits until the entry is closed.
      - Anyone who can see the request sees that it is still being entered, by whom, and when its lines last changed. A change to a line's type, date, description, quantity, rate, amount or who did the work removes that line's working decision. A line with a review question can't be removed.
      - The request is created in review in one step; if it can't be put in review, it isn't created.
      - Lines are priced, and an unmatched line's worker filled in, on every save as submitting would, so freezing changes no decided amount; if it would, finishing is refused.
      - Values read from a file are confirmed when someone first tries to finish, by whoever is finishing. Confirmation is kept even if finishing then fails; any decided line it changed loses its decision, and finishing is refused until that line is decided again.
      - Finishing the first round requires what submitting does (the case number, who it is from, how and when it was received, a confirmed import, dated imported lines, billing rules), then freezes the request and its billing rule findings in the attempt's snapshot before recording the round. Reopening or a send-back changes decisions only, never lines.
      - Billing rule findings are live while the entry is open, then as frozen.
      - Before the first round is finished and before any question is asked, the user holding the line review may discard the request outright, as deleting a draft does.
      - Approvers are told when whoever entered the request also decided lines in its latest round. That is allowed; the two-person rule (enforce_invoice_approval_sequence) still applies.

  ask_review_question:
    description: Let the line reviewer ask the submitter a brief question about a line, hold review for the answer, and keep both on the request's record.
    applies_to: invoice_review_question
    trigger: before_change
    outcome: blocking
    requirements:
      - Any active staff user may ask, taking an unassigned request as deciding a line does, while the request is submitted, under review or awaiting an answer.
      - Every question is about one line of the request. A question and an answer are each brief, at most 500 characters.
      - Asking moves the request to awaiting an answer. While awaiting an answer, the reviewer may keep deciding lines but may not finish the round, and the submitter may not recall the request.
      - The submitter or the represented professional answers. A staff user may instead record an answer received another way, and is recorded as answering; this is also how review continues without a reply.
      - Each question is answered once. Questions and answers are never changed or deleted.
      - Answering the last unanswered question returns the request to under review.
      - Until the round is finished, lists of requests show reviewers which have unanswered questions and which have answered ones, and the submitter which have questions for them.
      - Asking and answering each record an invoice_event with the actor and time.
      - Questions and answers are visible to staff and to everyone who may read the request, including its submitter and represented professionals. They are kept in the system, never in exports or the billing record.

  assign_invoice_review:
    description: Route each request to a reviewer and its sign-off approvers, from configured defaults that staff can change.
    applies_to: invoice_review_assignment
    trigger: before_change
    outcome: blocking
    requirements:
      - On submission, assign line review to the case's active case_invoice_reviewer, else the configured default reviewer, else leave it unassigned. Assign sign-off to the configured default sign-off approvers in order.
      - Any active staff user may reassign line review on any request, ending the current assignment and recording who reassigned it; the same action may set the new reviewer as the case's reviewer for future requests.
      - Any staff user may change the request's sign-off approvers, their order or number, until the round is finished.
      - Assignees must be active staff users. Sign-off assignees, defaults included, must be allowed to sign off under the review settings: an administrator chooses whether anyone on staff may sign off or only the sign-off approvers they name.
      - Every reviewer can see every request under review; their own work is shown first.

  measure_review_waiting:
    description: Show how long a request has waited for review in working days.
    applies_to: invoice
    trigger: on_read
    outcome: informational
    requirements:
      - Waiting is counted in working days from submission, or from received_on for a request staff entered (authorize_staff_invoice_entry), excluding weekends; a configured holiday calendar may later exclude holidays too.
      - Requests waiting more than the configured number of working days are called out to reviewers.

  limit_review_comment_visibility:
    description: Keep review notes transparent and internal comments internal.
    applies_to: invoice_approval_decision
    trigger: on_read
    outcome: blocking
    requirements:
      - Line decision reasons and notes are visible to everyone who may read the request, including its submitter and represented professionals. So is a comment on approving or rejecting the whole request at sign-off, without who made it.
      - internal_only comments are visible only to staff users and never appear in submitter views or exports sent outside the review team.

  require_completed_invoice_approval:
    description: Complete approval only after the invoice and all its lines pass the chain.
    applies_to: invoice
    trigger: before_approve
    outcome: blocking
    requirements:
      - Require a non-superseded approval chain and at least one invoice line.
      - Require approval at every pre-approval decision, a decision for every line in the latest line-review round, and an approving sign-off from every assigned approver after that round.
      - Derive approval progress from decisions in the non-superseded chain.

  preserve_invoice_approval_history:
    description: Preserve decisions and prevent changed invoices from retaining stale approvals.
    applies_to: invoice_approval_chain
    trigger: before_change
    outcome: blocking
    requirements:
      - Do not overwrite or delete recorded decisions. Working line decisions are not recorded decisions.
      - Freeze the invoice, its lines, and the chain's decisions while the chain is non-superseded.
      - Before editing or resubmitting, supersede the chain and invalidate its approval for current use.
      - Preserve the reviewed invoice and line values in immutable history before permitting edits.
      - Start a new chain for renewed review; do not carry forward prior approvals automatically.
      - Audit chain creation and supersession with actor and timestamp.

  preserve_significant_history:
    description: Record significant case, assignment, approval, and payment changes.
    applies_to: audit_event
    trigger: after_change
    outcome: required
    requirements:
      - Record the affected record, event type, actor, and timestamp.
      - Prevent ordinary users from changing or deleting audit events.

  preserve_person_identity:
    description: Preserve person identity.
    applies_to: person
    trigger: before_change
    outcome: blocking
    requirements:
      - Require a usable display name without assuming all people have given and family names.
      - A person may have at most one professional profile, which is not required for case participation; client is a case_participant role, not a profile.
      - A user account may link to a person; a person need not have an account. Account linkage alone grants no case access.
      - When professional.user_account_id is present, its person must match professional.person_id.
      - Provider profiles reference exactly one of person_id or organization_id. Display name is the payee label, not an independent person identity.
      - Warn on probable duplicate people, including creation through case-participant or professional workflows; never merge automatically.

  validate_system_role:
    description: Validate a user account's configured system role.
    applies_to: user_account
    trigger: before_change
    outcome: blocking
    requirements:
      - A referenced system_role_id must be active and its role_context must be user_account.
      - system_role_id configures a permission role; it grants no permission by itself until an actor-permission mapping resolves it. Absence is a configuration gap, not an implicit grant or denial.

  validate_effective_relationships:
    description: Validate effective relationships.
    applies_to: case_assignment
    trigger: before_change
    outcome: blocking
    requirements:
      - Apply interval validation to assignments, affiliations, participants and case programs; an end must be later than its start. Case funding has no interval of its own; it is effective exactly when its case_program is.
      - Intervals are start-inclusive and end-exclusive. Current state is calculated at an explicit as-of time, not independently editable.
      - Assignment affiliation must belong to the assigned professional person; participant affiliation must belong to its person.
      - An affiliation office must belong to its organization. Retain historical affiliations after transfers.
      - At relationship start the referenced affiliation must be effective; later affiliation changes must not rewrite assignment or participant history.
      - Assignment roles are configured, including a primary role. Permit at most one overlapping primary assignment per case; other roles may overlap.
      - Ending an assignment records the ending actor and reason. Corrections preserve previous values, actor and timestamp in audit history.
      - Case office must belong to case organization when both are present; program/funding context changes preserve audit history.
      - Qualification policy applies by assignment role; do not assume every staff assignment requires professional qualifications.
      - A referenced role must be active and its role_context must match the field: participant_role_id requires case_participant, affiliation_role_id requires person_affiliation, assignment_role_id requires case_assignment (system_role_id on user_account is validated separately by validate_system_role).
      - Access is granted only through configured roles and effective assignments, never by contact participation or office membership alone.

  validate_case_children:
    description: Validate case children.
    applies_to: case
    trigger: before_change
    outcome: blocking
    requirements:
      - Every reference must resolve to its declared entity or configured reference set; restrict deletion of referenced or historical records.
      - Permit multiple participant roles per person per case, but reject duplicate overlapping relationships for the same case, person, role and affiliation.
      - Allow at most one primary case identifier and one primary issue per case; primary is optional.
      - Case identifier uniqueness is evaluated within issuer and identifier type; repeated identifiers require explicit duplicate review rather than merging cases.
      - Case funding's case_program must belong to the same case as the funding record.

  preserve_case_lifecycle:
    description: Preserve case lifecycle.
    applies_to: case_lifecycle_event
    trigger: before_create
    outcome: blocking
    requirements:
      - Use configured transitions with explicit allowed source status, target status, event type and authorized actor role.
      - Opening requires no prior lifecycle; closing requires an open state and a reason; reopening requires a closed state and a reason.
      - Other status changes must not bypass opening, closing or reopening guards.
      - Closing ends every assignment active at the closure effective timestamp, regardless of assignment role; write ended_at at that timestamp, the closing actor as ended_by_user_account_id, and a case-closure end reason.
      - Commit the closing event, assignment endings and status projections atomically; reject concurrent assignment creation that would leave an assignment active on a closed case.
      - New assignments must begin while the case is open and may not span a closed interval. Reject future assignment starts on closed cases rather than creating active closed-case assignments.
      - Reopening does not reactivate ended assignments; any renewed assignment requires a new record and normal eligibility checks.
      - Where case status is kept in an external system, closing here is an optional cleanup by any active staff user, allowed only while no payment request on the case is being reviewed and every approved or rejected one is communication_completed (requester_communication). Matching a later request to the closed case reopens it with that as the recorded reason (match_invoice_to_case).
      - Closure corrections must revalidate assignment intervals and preserve all prior ending facts; never silently reactivate assignments.
      - Serialize events with a positive sequence unique within the case and retain effective and recording timestamps.
      - Ordinary transitions cannot precede the latest effective transition. Backdated corrections reference the same-case corrected event and require authorized correction with a reason and replay validation.
      - Events are immutable. Corrections append history and must leave the effective transition sequence valid.
      - Create the opening event and case together; refresh current status and date projections in the same logical transaction.
      - Interpret calendar dates in configured reporting time zone; preserve original instants. Lifecycle event configuration must classify statuses as open or closed.

  validate_activity_and_time_context:
    description: Validate activity and time context.
    applies_to: time_entry
    trigger: before_change
    outcome: blocking
    requirements:
      - Time entries may exist without activities; one activity may have multiple time entries.
      - Linked activity and time entry must reference the same case. Staff on time is the worker, not necessarily the activity actor.
      - Duration must be positive; service date remains activity_on. Activity items must belong to the selected activity type.
      - Apply activity item/type validation to activities as well as timekeeping.
      - Referenced program and funding associations must belong to the time entry case and be effective on the service date.
      - Time entry office is the office for that work, not a copy of current professional office; do not copy mutable case classification.
      - Calendar end must follow start; linked activity must belong to the same case. Scheduled events do not prove completed work.
      - Preserve changes to time, activity, notes, communications and calendar records with actor, timestamp and prior values.
      - A time entry may be changed or deleted by its professional, or by a delegate acting for them under authorize_delegated_submission, only while no request other than a withdrawn one references it; one on a draft is changed through that draft (validate_payment_request), and one on a submitted request stays as reviewed.

  validate_payment_request:
    description: Validate payment request.
    applies_to: invoice
    trigger: before_submit
    outcome: blocking
    requirements:
      - Require one provider/payee, at least one line and a currency for each request. A request has at most one case, and all its lines belong to it; one with no case (match_invoice_to_case) has none on any line. Staff sending a request filed by person must have said which case it is for, or that it is not for one case; an external submitter may leave it unsaid. A request sent for matching before that step existed may have no case or provider, with or without the submitter's entered details for them.
      - Require both billing period bounds or neither and reject inverted periods, including supporting invoices.
      - Requested line and allocation amounts must be positive; submitted_total equals the sum of request lines.
      - An invoice line sets at most one of source_time_entry_id or source_expense_id, and the referenced time_entry or expense must be on the same case; a manual line sets neither.
      - Every submitted time line references a time entry: one the submitter chose from the case's unbilled time, or one created from the line on submission (with a service date, positive hours and the professional whose work it is). Only expense and other lines may be manual. A time entry is on at most one request that is not withdrawn; time on a withdrawn request is unbilled again. On a request with no case, time lines are manual and create no time entry, since time is recorded against a case.
      - Editing a time line on a draft edits its time entry, preserving the prior values; removing the line leaves the entry unbilled.
      - Currency applies to all request amounts; referenced preauthorizations must use the same currency. Do not infer exchange rates.
      - Supporting supplier invoice numbers are scoped to the request payee; warn on duplicates across requests rather than silently merging.
      - Freeze a schema-versioned submission_snapshot when creating the review chain; bind attestations and evidence to that attempt.
      - Record a draft creation event and each submission, review and final outcome with actual actor and timestamp; a system action such as import expiry records no actor and a reason instead. Status projections cannot bypass approval guards.
      - Request events are immutable with positive sequence unique per request; any referenced chain must belong to that request. Events and their triggering decisions are persisted atomically.
      - Preserve all old attempts, allocations and evidence before correction or resubmission; old attestations and approvals cannot authorize changed values.
      - Only a draft or withdrawn request with no recorded review decision may be deleted, by its submitter; deleting removes its lines, events, unreviewed earlier attempts and import records, deletes any retained file, and deletes time entries its import created unless another request uses them (those are unlinked). Any request with a review decision is retained.

  apply_professional_rates:
    description: Price time lines at the payee's stated rate or, when none is stated, the administrator-configured rate, and keep the configured rate for review.
    applies_to: invoice_line
    trigger: before_change
    outcome: blocking
    requirements:
      - Administrators, a configured system role, maintain the professional_kinds vocabulary, each professional's kind (a line reviewer may give a kind to an invoice's sender who has none, never change one), and each kind's hourly rate as a professional_kind_rate with an effective date; a new rate is added from a date, never by changing an earlier one. Further rate rules may be added later as configuration, not code.
      - The configured rate for a professional on a date is their own approved rate, else their kind's, each the one with the latest effective_from on or before it. Staff and anyone who may bill for that professional can see it.
      - A line's default rate on its service date is, in order, the request case's case_rate for the professional whose work it is, the case's case_rate for their kind, then the configured rate (set_case_rate). Travel and waiting time with no case rate of their type take their category's rate from that hourly default (apply_time_category_rates); mileage with none takes the professional's own rate per mile, else the mileage_rate. configured_rate records the default, rate_source where it came from and case_rate_id any case rate it came from. A time line's amount is its time entry's hours, or before one exists the line's hours, times its billed_rate, rounded to cents. billed_rate is the rate stated on the imported supporting invoice (unit_rate) when there is one, otherwise configured_rate; a submitter entering time directly cannot set a rate.
      - A draft may be saved with time lines not yet priceable, but a time line without a service date, positive hours, a professional kind or an effective configured rate cannot be confirmed from an import or submitted; the error says which is missing, for whom and for which date.
      - Amounts stated on an imported supporting invoice stay as evidence (stated_amount) and in the import's extraction result.
      - A time line's rate limit is its configured_rate when that came from a case rate; else the approved_hourly_rate of the latest decision on an approved preauthorization for the professional whose work it is on the request case (or for the whole case); else its configured_rate.
      - Review flags a time line whose billed_rate is above its rate limit, and a line whose stated amount differs from its quantity times its stated rate; neither blocks submission. Reviewers may re-price flagged lines (decide_invoice_lines), and any reviewer may correct the rate of any time, travel time or mileage line when approving it in part. Review flags a billed or corrected rate that differs from the line's configured_rate, its default.
      - Submission prices lines again, so the frozen snapshot carries the rates applied; a later rate change never alters a submitted attempt, except a case rate set while reviewing that request (set_case_rate).

  set_case_rate:
    description: Let a reviewer apply a changed rate to the matching lines of a request, or set the case's default rate for a person or kind of professional, only from the line decision while reviewing.
    applies_to: case_rate
    trigger: before_change
    outcome: blocking
    requirements:
      - Any active staff user who may decide the request's lines (decide_invoice_lines) may, from the decision on a dated line with hours or miles, apply a changed rate to this line only, to the undecided lines on the request by the same professional at the same type of rate, or to the case's default for that professional or their kind from a date. Case rates are set nowhere else.
      - The matching lines and the lines a case default governs are approved at that rate with their own hours or miles. Lines already decided keep their decisions; lines the time log blocks are left undecided (check_lines_against_time_log), except the chosen line, which needs the override reason.
      - A case default needs a request with a case, a reason from the case rate list (invoice_decision_reasons.applies_to case_rate, with another reason needing a note), and a date of work on or before the chosen line's. The date defaults to the earliest matching line and may be earlier.
      - Each case default is a new case_rate row recording the case, the person or kind, the type of rate, the rate, the default it replaced on the chosen line, the date, the reason, the request, the staff user and when. Rows are never changed or deleted. A row from the same date as the latest for that person or kind and type records the one it corrects. A row with no rate returns the case to the configured rate from its date; it is refused when the case has no rate of its own for them.
      - A case rate changes the default (configured_rate, rate_source, case_rate_id) only on the lines of this request it governs. Every other request keeps the defaults it was sent with; an open request on the case whose lines a later case rate would now govern is flagged as changed since it was sent, and its reviewer reprices lines only if they choose to.
      - A case rate for the person comes before one for their kind; setting one for the kind is refused on a line the person's own case rate governs.
      - Setting a case rate states the latest row for that person or kind and type the page showed; if another has been recorded since, it is refused and the page shows the latest.
      - The reason and note are shared like other review feedback on the lines decided at that rate. Before signing off, approvers see every case rate set on the request, with the old and new rates, who set it and why. Staff see a case's rates on its requests and on the case, in date order with the ones in force now; submitters and exports never see case rates as such.

  apply_mileage_rates:
    description: Price mileage from an administrator-configured rate per mile rather than payee-stated amounts.
    applies_to: invoice_line
    trigger: before_change
    outcome: blocking
    requirements:
      - Mileage is an expense line, and the expense it creates, with the configured mileage expense type. Its quantity is the miles claimed for the whole trip. Every mileage line is on a trip (apply_time_category_rates), whose trip_origin and trip_destination name where it started and ended, as an address or place, and round_trip says it went there and back.
      - Administrators add a mileage_rate per mile from an effective date, never by changing an earlier one. The rate on a date is the one with the latest effective_from on or before it; anyone entering or reviewing requests can see it.
      - A mileage line's amount is its miles times the rate on its service date, rounded to cents; billed_rate records the rate applied and the submitter cannot override it. A stated amount from an imported file stays as evidence.
      - A draft may be saved with mileage not yet priceable, but a mileage line without a service date, positive miles or an effective rate cannot be confirmed from an import or submitted; the error says which is missing.
      - Import may suggest classifying an expense described as mileage as mileage, taking the miles from its quantity or description; the extraction result keeps the file's own classification.

  apply_time_category_rates:
    description: Claim a trip's travel time, mileage and travel costs as separate lines linked to one trip, and price travel and waiting time from configured time category rates.
    applies_to: invoice_line
    trigger: before_change
    outcome: blocking
    requirements:
      - A trip groups lines on one request; every line on it shares its date, which is required to confirm an import or submit. A trip has at most one time line, its travel time, at most one mileage line, any number of expense lines for its other costs (such as parking, tolls, fares or lodging), and no other lines. A trip with no lines is removed.
      - Each line on a trip is requested, reviewed, decided, allocated and exported on its own; the trip changes none of those rules. Removing a trip removes its lines.
      - A mileage line entered or imported without a trip is given one of its own, from its date and route.
      - Time falls in one of three categories - work, travel (a time line on a trip) or waiting (a time line off a trip with time_category waiting). Travel and waiting time are priced like work (apply_professional_rates), except that the configured_rate is their category's rate on the date. Travel time has its own hourly rate: a professional's own travel time rate in force on the date, set by administrators from a date like their other rates, comes before the category's rate; a case rate for travel time comes before both (set_case_rate). Administrators add a time_category_rate for a category from an effective date, never by changing an earlier one, with one basis - the professional's hourly rate, a percent of it, or one flat hourly rate - and the rate for a category on a date is its setting with the latest effective_from on or before it. With none in force, that time is priced at the hourly rate. A percent of an hourly rate is rounded to cents.
      - A rate stated on an imported supporting invoice still becomes billed_rate, and review flags it when it differs from the category's rate. Reviewers may change it (decide_invoice_lines).
      - Time billing rules (billing codes, time increment, daily hour cap, long entry) apply to travel and waiting time as to other time.
      - Anyone entering or reviewing requests can see the travel and waiting time rates in force.
      - Imports never put lines on a shared trip. While checking a request, before submitting, the submitter or staff may put a time or expense line onto a trip with a mileage line on the same date, or take it off again; doing so is offered, never required. Each imported mileage line stays its own trip until they do.
      - Reviewers are shown, for each date a request claims travel, how many of the same professional's other submitted requests on another case also claim travel that day, with a way to open all of that professional's requests with an item on that date beside the review.

  dismiss_mileage_warning:
    description: Let a reviewer set aside a mileage line's distance warning that stops on the way explain.
    applies_to: mileage_warning_dismissal
    trigger: before_create
    outcome: blocking
    requirements:
      - A trip has one start and one end, even with stops in between, so the mileage distance rule may warn about a trip that made stops.
      - Any active staff user who may decide the request's lines may set aside the warning on a mileage line while its lines are reviewed, saying what the stops were, or put it back. Each is recorded with the staff user and when; the latest stands.
      - The warning as submitted is never changed or removed from the snapshot. A set-aside warning no longer counts among the request's open mileage warnings; staff, sign-off included, see who set it aside and why. Submitters and exports don't see it.

  apply_billing_rules:
    description: Apply the deployment's configured billing rules to payment requests.
    applies_to: invoice
    trigger: before_submit
    outcome: blocking
    requirements:
      - Each deployment serves one agency with one set of rules. Administrators set each rule to off, warn or require, with its parameters, as a billing_rule_setting; a new setting takes over from when it is recorded and earlier ones are kept.
      - Rules are configuration, not code paths for a particular agency. Every rule is off unless an administrator turns it on.
      - Billing codes - each time line carries a task code from the configured billing_codes vocabulary.
      - Time increment - each time line's hours are a whole multiple of the configured increment. Hours are flagged, never rounded.
      - Daily hour cap - one professional's billed hours on one date, across this request and other submitted requests, stay within the cap; other drafts do not count.
      - Long entry - a single time line over the configured hours is flagged as possible block billing; this rule can only warn.
      - Billing period - the request states a billing period, optionally within one calendar month.
      - Mileage distance - each mileage line's miles stay within the configured tolerance percent of the driving distance between its trip's trip_origin and trip_destination, doubled for a round trip. Require also makes trip_origin and trip_destination required; warn flags a trip without them. The distance is looked up from a routing service only on submission while the rule is on, and recorded on the trip with when it was checked; a trip that cannot be measured (address not found, service unavailable or an optional deployment lookup limit reached) produces no finding and is left to the reviewer. Address matching tolerates common variations in spelling, and one lookup serves a trip in either direction.
      - Travel time and distance - a trip's travel hours stay within the configured tolerance percent of its distance at the configured average speed, plus a quarter hour. The distance is the measured driving route (doubled for a round trip) when the mileage distance rule measured it, else the miles claimed; a trip with neither produces no finding. This rule makes no lookups of its own.
      - Reviewers see a travel log of each request's trips with the travel time and miles claimed, other travel costs, the driving distance where known and a link to check the route themselves, in place of printed map evidence.
      - A warn finding is shown to the submitter before submission and to reviewers; a require finding blocks import confirmation and submission with a message naming the item and the rule. Submitters see which rules are in force where they enter requests.
      - The submission snapshot records the rule settings in force and every finding, so a later change to a rule never alters what a reviewed attempt was checked against.

  record_approved_request_amounts:
    description: Record approved request amounts.
    applies_to: invoice_approval_decision
    trigger: before_create
    outcome: blocking
    requirements:
      - Approving a line requires approved_amount between zero and that line requested amount, except a line approved at a changed rate (decide_invoice_lines), which may exceed it and is flagged for sign-off. Pre-approval and non-approval outcomes omit approved_amount.
      - The approved request amount is the sum of approved line amounts in the latest line-review round of the current chain; it is not submitted_total. Rejected lines contribute nothing.
      - A later line-review round in the same chain replaces the earlier round's amounts and may raise or lower them; earlier rounds stay in history. Changes to the request itself require a new review attempt.
      - Final decisions, allocation decisions and completion events are recorded atomically; final approval requires all requested lines reviewed.
      - Denial requires a reason and preserves requested values; a denied attempt has no spendable approved amount.
      - Attestation policy specifies required attestor roles and evidence; verify their case relationship as of attestation time without assuming all attestors have accounts.

  validate_authorization_draws:
    description: Validate authorization draws.
    applies_to: invoice_authorization_allocation
    trigger: before_change
    outcome: blocking
    requirements:
      - Allow one allocation per request and preauthorization; a request may use multiple preauthorizations and a preauthorization may support multiple requests.
      - Allocation case must match the preauthorization case; any restricted provider must match the request payee.
      - Sum of requested allocations must not exceed requested total. Whether full coverage is mandatory is configured, not assumed.
      - At final review, allocation decisions reference approving final-sequence line decisions and allocations from that same request and frozen attempt.
      - For each line the allocated approved amounts must not exceed its approved amount; for each allocation their sum must not exceed its requested amount.
      - At approval, require each drawn authorization to have an effective approving decision and atomically check its ceiling minus effective approved draws across requests; prevent concurrent requests from overspending.
      - Allocation decisions are immutable and unique per final line decision and request allocation; a later review attempt cannot reuse an earlier draw decision.
      - Uncovered amounts, reservations for pending requests, expiry and permitted overrides require explicit policy before enabling the affected workflow.
      - Superseding an unpaid approval removes it from current commitment only as an audited atomic transition; approvals with external completion confirmation cannot be superseded until reconciliation policy exists.
      - Historical draws remain queryable even when an attempt is superseded; never sum every historical attempt as current consumption.

  preserve_authorization_decisions:
    description: Preserve authorization decisions.
    applies_to: preauthorization_decision
    trigger: before_create
    outcome: blocking
    requirements:
      - Use positive sequence numbers unique within each preauthorization and record the actual reviewer and effective timestamp.
      - An approval or revision specifies a nonnegative ceiling; denial omits approved_amount and requires a reason.
      - Ceilings are replacement amounts, not additive approvals; the latest effective decision determines the ceiling.
      - Denial cannot revoke a ceiling with committed draws; resolve commitments under explicit policy first.
      - Reject a reduction below effective committed approved draws. Preserve decisions immutably and serialize ceiling changes with draw approvals.
      - Any active staff user may enter a case's pre-authorized amount for one professional or the whole case, as an approved preauthorization with its first decision, or change it with a revised decision that keeps its hourly rate.
      - A provider has at most one approved preauthorization on a case (and a case at most one for the whole case); asking for more revises its ceiling to the new total (request_preauthorization) rather than adding another.
      - Configured status and outcome mappings distinguish pending, approved and denied; external preauthorization is separate from invoice-chain pre-approval.

  request_preauthorization:
    description: Let an appointed attorney ask for a provider's work on a case to be pre-authorized, or for more, and let staff decide it.
    applies_to: preauthorization_request
    trigger: before_change
    outcome: blocking
    requirements:
      - A submitter may request for a provider they bill for or who works on their cases, on a case they are on or by entering its number and county as proposed details; staff may record a request received another way, with how and when it arrived and the attorney it is from. Each request records its requester and gets the next number in the yearly sequence when received.
      - A request states the kind of service, what it is for, the rate and its basis (hourly, flat or per unit), the hours or units expected where not flat, the total asked for including anything already pre-authorized, and why it is needed.
      - Before sending, the requester sees the provider's limit on the case (apply_preauthorization_limit), what has been billed against it and, when the total asked for is within the threshold, that no pre-authorization is needed. They may still send it.
      - When the provider has no CV or no current fee schedule or quote on file, the request asks for them (request_provider_documents); it can be sent without them, marked as missing them.
      - Any active staff user may ask the requester for more information (preauthorization_question); the request is then info_requested until every question is answered, by the requester or by staff recording an answer received another way. Questions and answers are recorded once, never changed, visible to the requester and staff, and never exported.
      - A request may also be for work not for one case, such as court observation, giving only its county.
      - Staff decide a request once, recording the outcome, reason and actor - approved, denied, not_needed (within the threshold), duplicate or moot (the work was already done). Denial, not_needed, duplicate and moot need a reason, which the requester sees. Before approving, staff match a provider that is only proposed, and say which case it is for with the same case step as a request for payment (match_invoice_to_case): a case found by number and county, one added from them (add_case_from_request), or not for one case.
      - Approving sets the amount and optionally the hourly rate, which may differ from what was asked. For a case, it records a decision on the provider's preauthorization for the case - its first approval, or a revised decision with the approved total - under preserve_authorization_decisions, so an approved total below what is already approved for the provider is refused. Not for one case, it records the decision and amount on the request only, setting no preauthorization or limit.
      - The requester may withdraw a request not yet decided. Decided and withdrawn requests are kept and never changed; asking again is a new request.

  apply_preauthorization_limit:
    description: Work out how much of a provider's work on a case may be billed before more must be pre-authorized.
    applies_to: preauthorization_threshold
    trigger: on_read
    outcome: informational
    requirements:
      - A provider's limit on a case is the ceiling of their approved preauthorization on it (the latest decision; ceilings replace, never add) or, with none, the threshold in force for the case's county or setting. A case-wide preauthorization is a separate limit on all providers' work on the case together.
      - The threshold in force on a date is the latest preauthorization_threshold for the case's county on or before it, else the latest default. Administrators add thresholds; a new one takes over from its date and earlier ones are kept. Amounts are configuration, never fixed values.
      - Thresholds apply to providers of the configured professional kinds (such as investigators and experts), not to an appointed attorney's own fees. With no threshold set, nothing is needed below a preauthorization's ceiling and a provider without one has no limit.
      - What counts against the limit is the approved amount of signed-off requests for that provider on the case and the requested amount of their requests still in review, until allocation draws (validate_authorization_draws) are built.
      - Limits warn; they never block approving a request.
      - A request for payment or a preauthorization request not for one case has no limit to count against.

  explain_preauthorization_overrun:
    description: Ask for the reason a provider's work went past its limit, without refusing payment for it.
    applies_to: invoice_overrun_explanation
    trigger: before_submit
    outcome: blocking
    requirements:
      - When sending a request with a case would take its provider's total on that case past their limit (apply_preauthorization_limit), the submitter is shown the limit and the total and must explain why more was not pre-authorized before it can be sent. The explanation is bound to that attempt with the limit and total at the time, recorded once and never changed.
      - A request whose case is matched only later is checked when matched; with no explanation it is flagged, and the reviewer may ask for one with a review question (ask_review_question).
      - Reviewers see the overrun, the limit's source and the explanation on the request and in the queue; they may still approve, cut or reject it. This is the policy for uncovered amounts that validate_authorization_draws asks for.
      - Explanations are shown to staff and the submitter, and never exported or put in the billing record.

  request_provider_documents:
    description: Keep a provider's CV and fee schedule or quote on file and ask for them when missing.
    applies_to: document_link
    trigger: before_create
    outcome: informational
    requirements:
      - Staff and anyone who may bill for a provider may add the provider's CV, fee schedule or quote, linked to the provider with its purpose, and a provider_service_rate for each service it lists, with its date. A newer document supersedes an older one, which is kept.
      - A provider's documents are kept records, not working copies of a request's files, and stay while the provider is on record.
      - A preauthorization request for a provider with no CV, or no fee schedule or quote, asks for it; staff see which are missing when deciding.

  report_preauthorization_usage:
    description: Show staff how pre-authorized and threshold limits are used, by county.
    applies_to: preauthorization_request
    trigger: on_read
    outcome: informational
    requirements:
      - For a chosen period, one row per county or setting with the threshold in force, requests received by status, amounts asked for and approved, what is billed against limits (approved and waiting), what is left, providers over their limit with the amount over and how many lack an explanation, and providers billing within the threshold without a preauthorization.
      - Each count leads to the requests or cases it counts. Configured billing staff roles may download it; it holds no client names.

  validate_payment_confirmation:
    description: Validate payment confirmation.
    applies_to: payment
    trigger: before_create
    outcome: blocking
    requirements:
      - Require a completed current invoice approval chain belonging to the referenced request and an authorized recording user.
      - Record external completion evidence, source, recording actor and timestamp; paid_on is the reported payment date, not the recording date.
      - Recording confirmation must never initiate, schedule, authorize a bank transfer or execute payment through an integration.
      - Allow one completion confirmation per request; serialize creation and reject duplicate external references within the confirmation source when supplied.
      - Amount is optional reported evidence in the request currency; do not substitute the approved amount when it is unknown.
      - Flag any reported amount differing from approval for reconciliation without discarding the external evidence or changing approved amounts.
      - Absence of confirmation means completion unconfirmed, not proof of nonpayment. Approval and external completion are separate read states.
      - Preserve confirmation facts and audit history; corrections require explicit reconciliation policy and cannot silently overwrite evidence.
      - Partial settlement and external refund/reversal reporting require a later reconciliation design; executing payments, refunds or reversals is outside scope.
      - Never restore authorization capacity merely because external payment is confirmed.

  validate_documents:
    description: Validate documents.
    applies_to: document_link
    trigger: before_create
    outcome: blocking
    requirements:
      - Require exactly one target among case_id, invoice_id, preauthorization_id, preauthorization_request_id and service_provider_id. All target and document references must resolve.
      - Supporting invoice and signature documents must be linked to the same request or its case; evidence cannot be silently replaced after submission.
      - Document versions are immutable and identify their predecessor; content hashes and storage references must resolve to the retained version unless content_deleted_at records deletion under a no-retention policy.
      - Authorize document retrieval through the target domain record. A link or storage identifier alone does not grant access.

  validate_invoice_import:
    description: Treat extracted supporting invoice values as a proposal that only the submitter can confirm.
    applies_to: invoice_import
    trigger: before_change
    outcome: blocking
    requirements:
      - Store the uploaded file as a document version with its content hash before processing. Accept only configured structured and document formats, verified from content rather than the file name; enforce configured size and page limits, one file per import; reject encrypted, macro-enabled or malformed files.
      - Scan each file for malware within the processing boundary before parsing and reject it on detection or scan failure. Parse in isolation with time and memory limits; never execute embedded content.
      - Uploaded files are working copies, not records of their own: keep them in private storage with no public or long-lived links, serve them only to the uploader, authorized delegates and staff reviewing the request, and exclude them from versioning and backups so that deletion removes them.
      - The uploader must be authorized to submit requests for the selected case; selecting or extracting a case grants no access.
      - The uploader designates either one case for the whole file, or one professional whose cases the file's lines cover. With a professional, every line is billed to that professional as the one whose work it is, set rather than suggested, and each line names its case; the system may suggest a case from a line's case reference, identifier or client name among the professional's open assignments the uploader may bill, but the uploader assigns every line before anything is created, and the file becomes one import and one draft request per case, sharing the one document.
      - Extraction creates at most one draft request per import and never submits, approves or creates source records on the submitter's behalf.
      - A line with no service date in the file keeps its place in the file's order and takes the date of the line before it on the same request, with a warning for the submitter to check; a line with no earlier date stays blank with a warning. Lines are not split across days. Confirmation and submission require a date on every line read from the file.
      - Retain extraction method, version, timestamp and result immutably. Corrections are made on the draft request; re-processing creates a new import rather than overwriting a result.
      - Show the original file beside the draft while the submitter checks and changes its lines, and beside the request while it is reviewed. The file is kept while any import of it is unresolved or its confirmed request is live, and its content is deleted (recording content_deleted_at, keeping the document metadata, hash and extraction result) when its imports are discarded or expire, or its request is withdrawn, deleted or recorded as paid.
      - The submitter may change, remove, restore and add lines without a reason. Each line keeps the place in the file it was read from (invoice_line.source_location); the extraction result keeps each line as first drafted, so reviewers see what changed and the lines removed, which need no decision.
      - The draft request and its submission snapshot are the record of the supporting invoice; exports do not include the original file.
      - Production extraction runs within the system's processing boundary, which includes services hosted in the organization's own cloud account. Services outside it may be used only with synthetic data during development.
      - A document without a text layer may be read by text recognition within the processing boundary; the extraction result says so. Extraction uses printed figures and never reads handwritten notes or corrections as values.
      - When the first extraction method can't read a document or its figures don't reconcile, a further in-boundary method may read it; the result records the method that produced it.
      - Extraction that takes more than a moment runs after the upload is stored, showing the uploader its progress; the uploader may discard the import meanwhile. An extraction that is interrupted fails with a reason, never leaving the import waiting.
      - Discarding an import records the actor and timestamp and creates no request, time entries or expenses.
      - A file that could not be read and is not discarded within three days of upload expires: its content is deleted and the import discarded without a resolving user. A file that was read is a draft request, kept until the submitter sends, discards or deletes it.

  reconcile_imported_invoice:
    description: Show discrepancies between extracted values and the draft request before submission.
    applies_to: invoice_import
    trigger: before_submit
    outcome: warning
    requirements:
      - Compare any stated total with the sum of draft lines; the request total is still calculated from lines under validate_invoice_total.
      - Compare stated quantity times rate with each line amount; flag service dates outside the billing period.
      - Compare any page or section subtotal the document states with the lines above it.
      - Read pages after the invoice's total too. Note an attachment whose total or items match a line as that line's likely backup; offer other attachment items as suggestions the submitter may add, and point out other amounts written there. Never add attachment items to the draft by themselves.
      - Files embedded in a PDF are attachments too, read within the same limits; a document with no items of its own (a cover letter) is read from the embedded invoice. Name embedded files that couldn't be read.
      - When a PDF's values can't be read because it is a dynamic (XFA) form, say so and how to make a readable copy.
      - Flag lines whose figures text recognition read with low confidence, and lines it could not read, for the submitter to check against the document.
      - Warn when the same document content hash or supporting invoice number for the payee was already imported or submitted from another document; imports split from one document don't warn about each other. Do not merge automatically.
      - Show each warning beside the original document and the extracted value it concerns.

  create_time_entries_from_import:
    description: Record time from confirmed imported lines without duplicating existing time.
    applies_to: time_entry
    trigger: before_create
    outcome: blocking
    requirements:
      - Before confirming, the submitter classifies each line as time, expense or other; extracted hours or an expense code may suggest a classification.
      - Create time entries only for confirmed time lines with a service date and positive hours, atomically with submission of the request; link each line through source_time_entry_id and the entry through source_invoice_import_id.
      - Before confirming an import, the submitter matches each distinct timekeeper label to an existing professional, recorded as timekeeper_professional_id; a line without a label is matched explicitly as well. Unmatched lines block confirmation. Never create people or professionals from labels.
      - Each matched professional must have been assigned to the request case on the line's service date, and the submitter must be that professional or an authorized delegate under authorize_delegated_submission.
      - A previous match for the same payee and label may be suggested, but the submitter confirms every match.
      - Attribute each imported time entry to its matched professional and require a configured activity type.
      - Warn on probable duplicates of existing time entries for the same professional, case, date and hours, and allow linking the existing entry instead; never merge automatically.
      - Apply validate_activity_and_time_context to imported entries as to directly recorded time.

  create_expenses_from_import:
    description: Record expenses from confirmed imported lines without duplicating existing expenses.
    applies_to: expense
    trigger: before_create
    outcome: blocking
    requirements:
      - Create an expense only for a confirmed expense line with a service date and positive amount, atomically with submission of the request; link the line through source_expense_id and the expense through source_invoice_import_id.
      - Require a configured expense type, which an expense code may suggest; the expense date is the line's service date and its amount the line amount.
      - Apply the timekeeper matching and assignment requirements of create_time_entries_from_import to expense lines.
      - Warn on probable duplicates of existing expenses for the same case, date, type and amount, and allow linking the existing expense instead; never merge automatically.

  authorize_delegated_submission:
    description: Allow a configured delegate, such as office support staff, to prepare and submit requests for professionals in their office.
    applies_to: invoice
    trigger: before_submit
    outcome: blocking
    requirements:
      - A submitter acts either for their own professional profile or as a delegate. A delegate needs an effective person_affiliation with a configured delegate role (role_context person_affiliation) in the same office as each professional they act for, effective when they upload, edit, recall or submit.
      - Office membership, an account or a case participant role alone never grants delegate authority; a delegate needs no professional profile or case assignment of their own. An administrator may add a delegate for an office under manage_external_sign_in.
      - Every professional a request relies on, including matched timekeepers, must have been assigned to the request case on the relevant service date; delegation does not substitute for assignment.
      - On a delegated request every line identifies its professional through timekeeper_professional_id; those are the represented professionals.
      - Record the actual delegate as submitter and actor on every request event, distinct from the professionals whose time is billed and from any attestor.
      - Represented professionals need not attest or approve before review. They may view and export the request like its submitter.
      - A delegate may read the time entries of each professional they act for on cases that professional is assigned to, and record time for that professional there; the entry's professional is the one whose work it is and recorded_by_user_account_id is the delegate.

  manage_external_sign_in:
    description: Let an administrator turn emailed-code sign-in on or off for an external user, adding their email or the person first where needed.
    applies_to: person
    trigger: before_change
    outcome: blocking
    requirements:
      - External users are people outside the agency who send invoices: professionals, and delegates under authorize_delegated_submission. Only those whose external sign-in an administrator turned on may sign in; no other list or setting admits anyone. Staff accounts never sign in this way.
      - Only an administrator turns external sign-in on or off. Any staff user may see who can sign in.
      - Turning it on needs the email they will sign in with. For someone with none, the administrator adds it, refused if it is already used by an account or another person. Once someone has signed in, their account's email stays.
      - An administrator may add a new external user with sign-in on - a professional with a name, email and professional kind (as add_professional_without_login), or a delegate with a name, email and the office they send for, from that day - refusing an email already in use. Adding one assigns them to no case.
      - An administrator may make an existing external user, such as a professional, a delegate for an office from that day, or end that delegation; an ending is recorded, never deleted, and a professional keeps their own profile either way.
      - Turning it off ends any session they have open and refuses new sign-ins. Their account, profile, requests and history are kept, and it can be turned on again.
      - Record the actor, time and prior value of every change, and of any email added. No email is sent to the person.

  authorize_staff_invoice_entry:
    description: Allow staff to enter a request that a professional sent outside the system, such as by email or from another tool.
    applies_to: invoice
    trigger: before_submit
    outcome: blocking
    requirements:
      - Any active staff user (a configured staff role in role_context user_account) may prepare and submit a request for any professional assigned to the case, by typing its items or importing the received file, with the same validation, pricing, import and billing-rule checks as a submitter.
      - Staff entry needs no office affiliation and grants no other access; every professional the request relies on must have been assigned to the case on the relevant service date, as for authorize_delegated_submission.
      - Submitting a staff-entered request requires received_via_id and received_on, a date no later than today; the staff user is recorded as submitter and actor on every request event, distinct from the professionals billed.
      - The professionals billed may view and export the request like its submitter, read-only; they did not submit it and cannot recall or edit it.
      - The staff user who entered a request may also review its lines. Sign-off still requires a user other than the submitter (decide_invoice_lines).
      - Staff may read and record time for professionals on the cases they enter requests for, as a delegate may.
      - Staff may save a draft before saying which case it is for, but must say so, or that it is not for one case, before sending it or, for one entered in review, before finishing its first round (match_invoice_to_case). It may be for any active professional.

  match_invoice_to_case:
    description: Say which case a request filed by person is for - an existing case, a case added from it, or not for one case - streamlining the common case where the file gives its number and county.
    applies_to: invoice
    trigger: before_update
    outcome: blocking
    requirements:
      - Each request filed by person answers one case question (case_choice) - for a case, or not for one case (such as court observation, which keeps only its own county) - using the case number and county read from its file, editable before sending. Staff entering a request must answer it before sending, or, for one entered in review (enter_request_in_review), before finishing its first round. An external submitter may answer "not for one case", put the request under one of their own cases (below), or leave it unanswered with or without a typed number.
      - For a case, staff find it by number within the county. The same number, ignoring case, on a case in the same county is chosen without asking. A number matching only when punctuation, spacing and leading zeros are ignored, on a case in the same county or with no county, is offered, and staff must say whether it is that case or a new one (add_case_from_request) before going on. A case in another county is never offered. With no match, a new case is added.
      - A draft keeps the answer until it is sent; changing its case number or county clears an answer for a case, so it is asked again. The request is then sent with no case and matched to the chosen or added case at once. In review, a choice applies at once. Matching keeps the request's prices and default rates as sent, flags case rates that would now apply (set_case_rate), assigns every professional it bills who isn't on the case as an external submitter, reopens a case closed here as a cleanup (preserve_case_lifecycle), and records a matched_to_case request event with the actor. A request that has its case is not matched again here (correct_case_records).
      - An external submitter's answer never creates or chooses a case of the organization's. Where they typed a number that is the same as an existing case's in the request's county, review offers that case as a suggestion; staff still choose. Their typed number stays beside the case's; reviewers correct it beside, never over.
      - A submitter filing a draft by person may instead put it under a case the professional whose work it is is assigned to and they may bill for, or take it off again; its case number becomes the case's, its lines are priced again, and on sending it goes to review with that case. A submitter's case list shows the open cases of the professionals they bill for, with each one's own pre-authorized amount and never the whole case's, whose approved total includes other professionals' requests.
      - A reviewer may answer or change the case question for a request in review without a case. Signing off never needs a case. A chosen case must be in the request's county, wherever both have one.
      - A request with no case is reviewed and signed off like any other, with no assignment, pre-authorization or case-based rate checks, and warnings that this system did not check its case, its professional's assignment or any pre-authorization. It counts under its own county (record_case_county).
      - Exports and the billing record of a request with no case carry the same warning in place of the case number.
      - Retired: invoice intake, sending for matching (send_for_matching) and the case-based new-invoice form and upload. Requests already sent for matching may still be matched and released to review (release_to_review); nothing new is sent there.

  add_case_from_request:
    description: Let staff add a case from a request's case number and county, without re-entering what the external case management system holds.
    applies_to: case
    trigger: before_create
    outcome: blocking
    requirements:
      - Only staff add a case this way, from a request for payment or a preauthorization request, with its case number and county (or a setting recorded in place of a county), and optionally the client's name. Nothing else is asked; cases are added only this way.
      - Refuse a number that is already a case's in that county, offering that case instead. When a case in that county, or with no county, has a close number (match_invoice_to_case), add it only once staff confirm it is a different case.
      - A request for payment's case is added when the request is sent, or at once when chosen in review; a preauthorization request's, when chosen. Two cases with the same number are never added in one county, even at once. If matching a request to the case added from it fails, trying again matches that case rather than adding another. Record the opening lifecycle event with the actor and the request it was added from.
      - A client's name adds a person in the client role on the case; possible duplicate people are listed for review (flag_possible_duplicate_client), never merged automatically. Without one the case has no client participant.

  correct_case_records:
    description: Let administrators fix cases added by mistake, and requests on the wrong case, in Settings, Edit data.
    applies_to: case
    trigger: before_update
    outcome: blocking
    requirements:
      - Only an administrator. List cases added from requests, newest first, narrowable to those with a close number on another case in the same county, each with who added it, when, from which request, and its requests.
      - Same case as another in the same county - move its requests for payment, their lines, imports and case rates set on them, its preauthorization requests and preauthorizations, and its active assignments to the kept case, then close it as added by mistake. Requests keep their prices and decisions, including signed-off ones, which then count under the kept case. Where both cases have a preauthorization for the same provider, the administrator chooses which to keep; the other stays on the closed case with its history. Other requests on the kept case that a moved case rate would now price are flagged, never repriced.
      - Wrong number, county or client - correct them on the case; requests keep the number they were sent with. A client's name is corrected on their person only when nothing but this case refers to them; otherwise a new person becomes the case's client and the earlier one's client role on it ends.
      - Not for one case - take its requests and preauthorization requests off it (they keep their own county, else take the case's, and become not for one case), and ask again on any draft that chose it, then close it as added by mistake.
      - Before any fix, show exactly what will move or change; each fix is all or none. A case closed as added by mistake leaves every list, search and picker, and stays in history.
      - Record every value a fix changed with its prior value, the administrator and the time. An administrator may undo a fix, restoring each value still as the fix left it and leaving anything changed since. Assignments the fix ended stay ended (preserve_case_lifecycle).
      - Possible duplicate people and cases are to move here later (flag_possible_duplicate_client, flag_possible_duplicate_case).

  add_professional_without_login:
    description: Let staff add a professional who has not signed in, so a request can say whose work it is.
    applies_to: professional
    trigger: before_create
    outcome: blocking
    requirements:
      - Any active staff user may add a professional with a name (optionally as given and family name, kept on the person), a professional kind and optionally an email; this creates a person and a professional profile with no user account. Record the actor.
      - Refuse an email already used by a user account or another professional rather than creating a probable duplicate.
      - When someone later signs in with that email, they receive the existing profile instead of a new one.
      - Adding a professional assigns them to no case and grants no access; they cannot sign in until an administrator turns on their external sign-in (manage_external_sign_in).
      - An administrator may correct the professional's name, and add or change the email of one who hasn't signed in, refusing an email already used in the same way; once they sign in, their account's email stays. Record the actor and the values replaced.
      - Whoever added a professional may correct their name (its given and family parts where entered separately), email and professional kind, on that same record rather than by adding them again, until removal would be refused as below, refusing an email already in use as above. Record the actor and the values replaced.
      - An administrator may remove a professional added by mistake, such as a sender added while entering a request never finished, recording the actor and the values removed. Removal is refused once they have signed in, are assigned to a case, have recorded time or a pre-authorization, have a role on a case, signed a request, or are named on a request that was sent or whose first round was finished. A request naming them that was never sent (a draft, a withdrawn draft or an open entry) is left with no one chosen in their place, its lines matched and priced again as on any save, and an open entry's working decision removed from each line that changed. The removed values, including their own rates and the requests changed, are kept with the record of removal.

  authorize_payment_request_export:
    description: Export submitted requests only to users who may read them.
    applies_to: invoice
    trigger: on_read
    outcome: blocking
    requirements:
      - Configured billing staff roles may export any submitted request. A submitter may export requests they submitted, and a represented professional requests a delegate submitted for them; no one else may.
      - Exports are reads and are not recorded as audit events.
      - Render the values of an identified submission attempt, its status and line decisions as of export time, labelled with that time; never mix values from different attempts.
      - Show the case number and court or other case numbers, and each line's latest recorded decision, reason and note. Earlier recorded rounds stay in the request's history but are not exported. Working decisions and internal_only comments are never exported.
      - Offer the same content in document and spreadsheet formats. Imported originals are not retained, so exports never include them.
      - Exports of signed-off requests are the documentation sent on for payment. Before downloading, anyone exporting may leave out any summary field other than the request identifier and totals, and any line or trip column; nothing is left out by default. Each person's last choice is offered again on their next export. Leaving fields out never changes the totals, and a file with fields left out is labelled as a redacted copy naming them. Redaction is for the file's recipients, not an access control, and does not search free text; staff still check exports for confidential information before sending.

  report_billing_results:
    description: Keep one billing record per submitted request, so spending can be reported outside the system without retyping.
    applies_to: invoice
    trigger: on_read
    outcome: informational
    requirements:
      - One row per submitted request, keyed by case number, with court or other case numbers, the request's own reference, the professional and their kind, who submitted it and how and when a staff-entered one was received, the billing period, submitted date, requested amount, status and the date it last changed, and the line reviewer.
      - The approved amount, the amount cut, the reasons used for cuts and rejections, and who signed off and when are filled once the request is signed off; a request still in review or awaiting sign-off shows none, since its numbers can still change.
      - Line detail stays in the system. Configured billing staff roles may download the record; any route to an external system reads from it.
      - Each row also carries the case's county, or the setting recorded in its place (record_case_county).
      - The record can be narrowed to signed-off requests in one county whose billing period overlaps chosen dates. A request with no billing period is left out of a narrowed record.
      - Each row carries the case's client. Before downloading, anyone may leave out any column other than the request's reference and amounts; nothing is left out by default, and each person's last choice is offered again. A spreadsheet with columns left out is labelled as a redacted copy naming them, and a redacted file's name says so.
      - Unresolved: payment track, budget account code and budget month, and the external payment date and reference are not yet held, so the record omits them.

  record_case_county:
    description: Record each case's county, or a setting such as post-conviction or prison in its place, from a list users can add to.
    applies_to: county
    trigger: before_create
    outcome: blocking
    requirements:
      - Wherever a county is chosen, the picker matches active counties as the user types, and lists settings that aren't counties (is_county false) before counties.
      - A user who may set the county may add one that isn't listed by typing its name. A name matching an existing county, ignoring case, spacing, punctuation and the word "county", reuses that county rather than adding a duplicate; one that is no longer active is refused, not reactivated. Record the actor. Adding a county grants no access.
      - Changing a county names the new one or clears it explicitly; a change saying neither is refused. A change after submission is recorded with the county it replaced.
      - An import may suggest the county from the file (a labelled county, a setting the file names but none of its items mention, or a place named as a court's county), preferring an existing county; the user confirms or changes it, and a county named only in the file is added only when the user goes on with it.
      - A request counts under its case's county; one with no case, under its own (match_invoice_to_case).
      - Unresolved: whether counties a submitter adds need staff review before others are offered them.

  authorize_invoice_review:
    description: Map configured system roles to review actions.
    applies_to: invoice_approval_decision
    trigger: before_create
    outcome: blocking
    requirements:
      - Every active staff user may upload, review lines, finish, reassign and sign off, since staff change duties often; administrators also change settings. Who may sign off can be narrowed to named sign-off approvers in the review settings (assign_invoice_review). Earlier reviewer-only and approver-only roles are retired; accounts that still have them act as staff, and their history is kept.
      - Review access is by role, not by case assignment; submitter access stays as authorize_payment_request_export and authorize_delegated_submission describe.

  recommend_configured_resources:
    description: Recommend configured resources.
    applies_to: case
    trigger: on_read
    outcome: optional
    requirements:
      - Optional implementation configuration may evaluate typed case paths including issue codes, county, jurisdiction, language, effective programs and funding.
      - Rules return authorized resource or template version identifiers with an explanation; recommendations do not mutate the case or grant access.
      - No canonical executable rules language or recommendation catalog is selected. Define versioning, precedence and missing-value behavior before implementation.
